[project]
name = "did"
version = "0.2.0"
description = "Local-first CLI and GUI for reviewing and pseudonymizing documents"
authors = [
    { name = "evidlabel", email = "210122431+evidlabel@users.noreply.github.com" },
]
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["anonymization", "pseudonymization", "privacy", "legal", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
]
dependencies = [
    "ruamel.yaml>=0.17",
    "spacy>=3.8.2,<4",
    "rapidfuzz>=3.10.0,<4",
    "presidio-analyzer>=2.2.0",
    "bibtexparser",
    "rich>=13.3.0,<14",
    "pydantic>=2.11,<3",  # Added for YAML handling with data validation
    "numpy>=2.3",  # Added for vectorization
    "treeparse>=0.2.8",
    "pypdf>=6,<7",
    "PySide6",
    "faker>=37,<38",
    "python-docx>=1.2,<2",
]

[project.optional-dependencies]
models = [
    "en-core-web-md",
    "da-core-news-sm",
    "da-core-news-lg",
]

[project.urls]
Homepage = "https://github.com/evidlabel/did"
Repository = "https://github.com/evidlabel/did"
Issues = "https://github.com/evidlabel/did/issues"

[project.scripts]
did = "did.cli:main"

[dependency-groups]
dev = [
    "mkdocs",
    "pre-commit",
    "pytest>=8.4.0,<9",
    "pytest-cov>=5.0",
    "pytest-qt",
    "pytest-rich",
    "ruff>=0.6.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }
da_core_news_sm = { url = "https://github.com/explosion/spacy-models/releases/download/da_core_news_sm-3.8.0/da_core_news_sm-3.8.0-py3-none-any.whl" }  # Added for Danish support
da_core_news_lg = { url = "https://github.com/explosion/spacy-models/releases/download/da_core_news_lg-3.8.0/da_core_news_lg-3.8.0-py3-none-any.whl" }  # Added for Danish support

[tool.hatch.build.targets.wheel]
packages = ["src/did", "src/gdid"]

[tool.hatch.build.targets.editable]
packages = ["src/did", "src/gdid"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-p no:warnings"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]
